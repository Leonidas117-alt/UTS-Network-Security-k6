
options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    recursion no;
};

logging {
    channel query_log {
        stderr;
        severity info;
    };
    category queries {
        query_log;
    };
};

zone "k6.exfil.lab" {
    type master;
    file "/var/lib/bind/db.k6.exfil.lab";
};
